[package]
name = "qdrant-sec"
version = "0.1.0"
authors = [
    "Qdrant Team <info@qdrant.tech>",
]
license = "Apache-2.0"
edition = "2024"
publish = false

[lints]
workspace = true

[features]
default = []

[dependencies]
constant_time_eq = "0.4.2"
data-encoding = { workspace = true }
fs-err = { workspace = true }
nix = { workspace = true }
ring = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "private_hnsw_oram_bench"
harness = false

[[bench]]
name = "private_oram_append_bench"
harness = false
