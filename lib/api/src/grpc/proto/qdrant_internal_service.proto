syntax = "proto3";

package qdrant;
option csharp_namespace = "Qdrant.Client.Grpc";

import "telemetry_internal.proto";
import "private_hnsw_oram_service.proto";
import "private_result_oram_service.proto";

service QdrantInternal {
  // Get current commit and term on the target peer.
  rpc GetConsensusCommit(GetConsensusCommitRequest)
      returns (GetConsensusCommitResponse) {}

  // Wait until the target peer reached the given commit ID.
  rpc WaitOnConsensusCommit(WaitOnConsensusCommitRequest)
      returns (WaitOnConsensusCommitResponse) {}

  // Get telemetry
  rpc GetTelemetry(GetTelemetryRequest) returns (GetTelemetryResponse) {}

  // Get audit log entries from this peer
  rpc GetAuditLog(GetAuditLogRequest) returns (GetAuditLogResponse) {}

  // Sign one bounded activation challenge from this peer's stable local Raft view.
  rpc AcknowledgePrivateOramMutationActivation(
      PrivateOramMutationActivationChallengeRequest)
      returns (PrivateOramMutationActivationChallengeResponse) {}

  // Durably stage one owner-signed encrypted private ORAM writeback.
  rpc PreparePrivateOramWriteback(PreparePrivateOramWritebackRequest)
      returns (PreparePrivateOramWritebackResponse) {}

  // Apply a prepared writeback after its epoch transition commits through Raft.
  rpc FinalizePrivateOramWriteback(CompletePrivateOramWritebackRequest)
      returns (CompletePrivateOramWritebackResponse) {}

  // Remove an uncommitted prepared writeback while its old view is still intact.
  rpc AbortPrivateOramWriteback(CompletePrivateOramWritebackRequest)
      returns (CompletePrivateOramWritebackResponse) {}

  // Recover one paired private ORAM owner from locally revalidated durable state.
  rpc RecoverPrivateOramMutationOwner(RecoverPrivateOramMutationOwnerRequest)
      returns (RecoverPrivateOramMutationOwnerResponse) {}

  // Durably install one coordinator-signed sequence-3 owner recovery capsule.
  rpc InstallPrivateOramOwnerRecoveryCapsuleV2(stream PrivateOramInstallChunk)
      returns (InstallPrivateOramOwnerRecoveryCapsuleV2Response) {}

  // Durably install one inert paired-owner intent before Raft mutation admission.
  rpc PrestagePrivateOramMutationOwnerV2(stream PrivateOramInstallChunk)
      returns (PrestagePrivateOramMutationOwnerV2Response) {}

  // Adopts one exact durable pre-stage only after the sequence-1 parent is published.
  rpc AdoptPrivateOramMutationOwnerV2(AdoptPrivateOramMutationOwnerV2Request)
      returns (AdoptPrivateOramMutationOwnerV2Response) {}

  // Durably fence one exact committed V3 reservation challenge on its owner.
  rpc PreparePrivateOramMutationOwnerReservationV3(
      PreparePrivateOramMutationOwnerReservationV3Request)
      returns (PreparePrivateOramMutationOwnerReservationV3Response) {}

  // Resolve one exact committed V3 reservation challenge on its owner.
  rpc ResolvePrivateOramMutationOwnerReservationV3(
      ResolvePrivateOramMutationOwnerReservationV3Request)
      returns (ResolvePrivateOramMutationOwnerReservationV3Response) {}

  // Create this owner's empty owner store for a V2 enrollment and report its signer.
  rpc DescribePrivateOramMutationOwnerStoreV2(
      DescribePrivateOramMutationOwnerStoreV2Request)
      returns (DescribePrivateOramMutationOwnerStoreV2Response) {}

  // Sign this owner's genesis commitment for its committed prepared V2 enrollment.
  rpc SignPrivateOramMutationOwnerEnrollmentV2(
      SignPrivateOramMutationOwnerEnrollmentV2Request)
      returns (SignPrivateOramMutationOwnerEnrollmentV2Response) {}

  // Idempotently install one complete signed encrypted index on a replica.
  rpc InstallPrivateOramIndex(InstallPrivateOramIndexRequest)
      returns (InstallPrivateOramIndexResponse) {}

  // Install one complete encrypted index through bounded ordered chunks.
  rpc InstallPrivateOramIndexChunks(stream PrivateOramInstallChunk)
      returns (InstallPrivateOramIndexResponse) {}

  // Idempotently install one consensus-bound live encrypted index for movement.
  rpc InstallPrivateOramLiveReplica(InstallPrivateOramLiveReplicaRequest)
      returns (InstallPrivateOramLiveReplicaResponse) {}

  // Install one live encrypted index through bounded ordered chunks.
  rpc InstallPrivateOramLiveReplicaChunks(stream PrivateOramInstallChunk)
      returns (InstallPrivateOramLiveReplicaResponse) {}

  // Ask the active source peer to preinstall and submit automatic shard recovery.
  rpc RequestPrivateOramShardRecovery(RequestPrivateOramShardRecoveryRequest)
      returns (RequestPrivateOramShardRecoveryResponse) {}
  rpc RequestPrivateOramReshardingResume(RequestPrivateOramReshardingResumeRequest)
      returns (RequestPrivateOramReshardingResumeResponse) {}
}

message GetConsensusCommitRequest {}

message GetConsensusCommitResponse {
  // Raft commit as u64
  int64 commit = 1;
  // Raft term as u64
  int64 term = 2;
}

message WaitOnConsensusCommitRequest {
  // Raft commit as u64
  int64 commit = 1;
  // Raft term as u64
  int64 term = 2;
  // Timeout in seconds
  int64 timeout = 3;
}

message WaitOnConsensusCommitResponse {
  // False if commit/term is diverged and never reached or if timed out.
  bool ok = 1;
}

message GetAuditLogRequest {
  // ISO-8601 start time (inclusive), omit for no lower bound
  optional string time_from = 1;
  // ISO-8601 end time (exclusive), omit for no upper bound
  optional string time_to = 2;
  // Key=value filters applied to every JSON field
  map<string, string> filters = 3;
  // Maximum number of entries to return
  uint64 limit = 4;
}

message GetAuditLogResponse {
  // Audit log entries as raw JSON strings (one per entry)
  repeated string entries = 1;
}

message PrivateOramMutationActivationChallengeRequest {
  // Exact canonical JSON for PrivateOramPeerActivationChallengeV1.
  bytes challenge_canonical_json = 1;
}

message PrivateOramMutationActivationChallengeResponse {
  // Exact canonical JSON for PrivateOramPeerActivationSignedAckV1.
  bytes signed_ack_canonical_json = 1;
}

// Internal-only wire contract for replicated private ORAM writebacks. The RPC
// methods using these messages are registered only after receiver-side runtime,
// signature, fixed-budget, and exact-transition validation is connected.
enum PrivateOramReplicationIndexKind {
  PRIVATE_ORAM_REPLICATION_INDEX_KIND_UNSPECIFIED = 0;
  PRIVATE_ORAM_REPLICATION_INDEX_KIND_HNSW = 1;
  PRIVATE_ORAM_REPLICATION_INDEX_KIND_RESULT = 2;
}

message PrivateOramReplicationEpochState {
  uint64 index_epoch = 1;
  string root_hash = 2;
}

message PrivateOramReplicationTransition {
  PrivateOramReplicationEpochState old = 1;
  PrivateOramReplicationEpochState new = 2;
  string writeback_digest = 3;
}

message PrivateOramReplicationBucket {
  uint32 version = 1;
  uint64 bucket_id = 2;
  uint64 index_epoch = 3;
  string ciphertext = 4;
  string ciphertext_sha256 = 5;
  string bucket_commitment = 6;
}

message PrivateOramReplicationSignature {
  string alg = 1;
  string key_id = 2;
  string sig = 3;
}

message PreparePrivateOramWritebackRequest {
  string collection_name = 1;
  string collection_id = 2;
  PrivateOramReplicationIndexKind index_kind = 3;
  // Required for HNSW and empty for the collection-level result ORAM index.
  string vector_name = 4;
  uint32 version = 5;
  PrivateOramReplicationTransition transition = 6;
  uint64 bucket_count = 7;
  repeated PrivateOramReplicationBucket updated_buckets = 8;
  PrivateOramReplicationSignature commit_signature = 9;
}

message PreparePrivateOramWritebackResponse {
  // Echoed only after the receiver independently derives the same digest.
  string writeback_digest = 1;
}

message CompletePrivateOramWritebackRequest {
  string collection_name = 1;
  string collection_id = 2;
  PrivateOramReplicationIndexKind index_kind = 3;
  string vector_name = 4;
  PrivateOramReplicationTransition transition = 5;
  string signing_key_id = 6;
}

message CompletePrivateOramWritebackResponse {
  bool completed = 1;
}

enum PrivateOramMutationOwnerTerminalKind {
  PRIVATE_ORAM_MUTATION_OWNER_TERMINAL_KIND_UNSPECIFIED = 0;
  PRIVATE_ORAM_MUTATION_OWNER_TERMINAL_KIND_FINALIZED_NEW = 1;
  PRIVATE_ORAM_MUTATION_OWNER_TERMINAL_KIND_ABORTED_OLD = 2;
}

message RecoverPrivateOramMutationOwnerRequest {
  // Canonical JSON encoding of qdrant_sec::PrivateOramPeerRecoveryRequestV2.
  bytes request_canonical_json = 1;
  // Coordinator peer identity and signature over the request, so an owner starts recovery work
  // only for its pinned coordinator.
  bytes coordinator_public_key_canonical_json = 2;
  bytes coordinator_signature_canonical_json = 3;
}

message RecoverPrivateOramMutationOwnerResponse {
  // Canonical JSON encodings of the terminal evidence and its peer-identity signature.
  bytes terminal_canonical_json = 1;
  bytes public_key_canonical_json = 2;
  bytes signature_canonical_json = 3;
}

message InstallPrivateOramOwnerRecoveryCapsuleV2Request {
  // Canonical JSON encoding of qdrant_sec::PrivateOramOwnerCapsuleInstallRequestV2.
  bytes install_request_canonical_json = 1;
  // Exact bounded canonical JSON encoding of the inert storage capsule package.
  bytes capsule_package_canonical_json = 2;
  // Coordinator peer identity and signature over request plus package digest/length.
  bytes coordinator_public_key_canonical_json = 3;
  bytes coordinator_signature_canonical_json = 4;
}

message InstallPrivateOramOwnerRecoveryCapsuleV2Response {
  // Exact canonical storage receipt and owner-signed transport response statement.
  bytes receipt_canonical_json = 1;
  bytes install_response_canonical_json = 2;
  bytes owner_public_key_canonical_json = 3;
  bytes owner_signature_canonical_json = 4;
  // Canonical transport-independent owner signature retained in Raft readiness state.
  bytes owner_install_attestation_canonical_json = 5;
}

message PrestagePrivateOramMutationOwnerV2Request {
  // Canonical JSON encoding of qdrant_sec::PrivateOramOwnerPrestageRequestV2.
  bytes prestage_request_canonical_json = 1;
  // Exact bounded canonical JSON encoding of the inert owner package.
  bytes prestage_package_canonical_json = 2;
  // Coordinator peer identity and signature over request plus package digest/length.
  bytes coordinator_public_key_canonical_json = 3;
  bytes coordinator_signature_canonical_json = 4;
  // Exact committed V3 reservation challenge authorizing this owner pre-stage.
  bytes reservation_challenge_canonical_json = 5;
}

message PrestagePrivateOramMutationOwnerV2Response {
  bytes receipt_canonical_json = 1;
  bytes prestage_response_canonical_json = 2;
  bytes owner_public_key_canonical_json = 3;
  bytes owner_signature_canonical_json = 4;
  // Transport-independent owner signature retained in the all-owner admission certificate.
  bytes owner_prestage_attestation_canonical_json = 5;
  // Owner-signed proof that the finalized reservation was consumed by this durable install.
  bytes reservation_resolution_receipt_canonical_json = 6;
}

message AdoptPrivateOramMutationOwnerV2Request {
  // Canonical JSON encoding of qdrant_sec::PrivateOramOwnerAdoptionRequestV1.
  bytes adoption_request_canonical_json = 1;
  // Canonical JSON encoding of collection::PrivateOramOwnerPrepareParentV2.
  bytes parent_canonical_json = 2;
  bytes coordinator_public_key_canonical_json = 3;
  bytes coordinator_signature_canonical_json = 4;
}

message AdoptPrivateOramMutationOwnerV2Response {
  // Canonical JSON encoding of collection::PrivateOramOwnerPreparedEvidenceV2.
  bytes evidence_canonical_json = 1;
  // Canonical JSON encoding of qdrant_sec::PrivateOramOwnerAdoptionResponseV1.
  bytes adoption_response_canonical_json = 2;
  bytes owner_public_key_canonical_json = 3;
  bytes owner_signature_canonical_json = 4;
}

message PreparePrivateOramMutationOwnerReservationV3Request {
  string collection_name = 1;
  string vector_name = 2;
  // Exact canonical JSON for qdrant_sec::PrivateOramOwnerReservationPrepareChallengeV1.
  bytes challenge_canonical_json = 3;
  // Pinned owner signing key used to resolve the vector-local HNSW owner context.
  string owner_signing_key_id = 4;
}

message PreparePrivateOramMutationOwnerReservationV3Response {
  // Exact canonical JSON for qdrant_sec::PrivateOramOwnerReservationPrepareV1.
  bytes prepare_canonical_json = 1;
  // Exact canonical JSON for the owner's PrivateOramPeerRecoveryPublicKeyV1.
  bytes owner_public_key_canonical_json = 2;
}

message DescribePrivateOramMutationOwnerStoreV2Request {
  string collection_name = 1;
  string vector_name = 2;
  // Pinned owner signing key used to resolve the vector-local HNSW owner context.
  string owner_signing_key_id = 3;
}

message DescribePrivateOramMutationOwnerStoreV2Response {
  // Exact canonical JSON for the owner's qdrant_sec::PrivateOramOwnerCleanupSignerV1.
  bytes owner_signer_canonical_json = 1;
  // Exact canonical JSON for the owner store's qdrant_sec::PrivateOramOwnerLifecycleStateV1.
  bytes lifecycle_state_canonical_json = 2;
}

message SignPrivateOramMutationOwnerEnrollmentV2Request {
  string collection_name = 1;
  string vector_name = 2;
  // Pinned owner signing key used to resolve the vector-local HNSW owner context.
  string owner_signing_key_id = 3;
}

message SignPrivateOramMutationOwnerEnrollmentV2Response {
  // Exact canonical JSON for qdrant_sec::PrivateOramOwnerEnrollmentGenesisCommitmentV1.
  bytes commitment_canonical_json = 1;
}

message ResolvePrivateOramMutationOwnerReservationV3Request {
  string collection_name = 1;
  string vector_name = 2;
  // Pinned owner signing key used to resolve the vector-local HNSW owner context.
  string owner_signing_key_id = 3;
  // Exact canonical JSON for qdrant_sec::PrivateOramOwnerReservationPrepareChallengeV1.
  bytes challenge_canonical_json = 4;
  // Reconstruct a durable finalized completion. An installed owner returns installed evidence;
  // an uninstalled owner releases only when the same attempt has committed PrestageAborted.
  bool recover_completion = 5;
}

message ResolvePrivateOramMutationOwnerReservationV3Response {
  // True only when the exact durable reservation fence was resolved.
  bool resolved = 1;
  // Exact canonical JSON for qdrant_sec::SignedPrivateOramOwnerReservationResolutionReceiptV1.
  bytes resolution_receipt_canonical_json = 2;
}

message PrivateHnswInitialReplicationBundle {
  PrivateHnswManifest manifest = 1;
  PrivateHnswSignature manifest_signature = 2;
  repeated PrivateHnswBucket buckets = 3;
}

message PrivateResultOramInitialReplicationBundle {
  PrivateResultOramManifest manifest = 1;
  PrivateResultOramSignature manifest_signature = 2;
  repeated PrivateResultOramBucket buckets = 3;
}

message InstallPrivateOramIndexRequest {
  string collection_name = 1;
  string collection_id = 2;
  PrivateOramReplicationIndexKind index_kind = 3;
  string vector_name = 4;
  oneof bundle {
    PrivateHnswInitialReplicationBundle hnsw = 5;
    PrivateResultOramInitialReplicationBundle result = 6;
  }
}

message InstallPrivateOramIndexResponse {
  uint64 index_epoch = 1;
  string root_hash = 2;
}

message PrivateOramInstallChunk {
  uint32 version = 1;
  uint64 chunk_index = 2;
  uint64 chunk_count = 3;
  uint64 total_bytes = 4;
  bytes request_sha256 = 5;
  bytes data = 6;
}

message PrivateHnswLiveReplicationBundle {
  PrivateHnswManifest manifest = 1;
  PrivateHnswSignature manifest_signature = 2;
  PrivateOramReplicationEpochState current = 3;
  optional string writeback_digest = 4;
  repeated PrivateHnswBucket buckets = 5;
}

message PrivateResultOramLiveReplicationBundle {
  PrivateResultOramManifest manifest = 1;
  PrivateResultOramSignature manifest_signature = 2;
  PrivateOramReplicationEpochState current = 3;
  optional string writeback_digest = 4;
  repeated PrivateResultOramBucket buckets = 5;
}

message InstallPrivateOramLiveReplicaRequest {
  string collection_name = 1;
  string collection_id = 2;
  PrivateOramReplicationIndexKind index_kind = 3;
  string vector_name = 4;
  oneof bundle {
    PrivateHnswLiveReplicationBundle hnsw = 5;
    PrivateResultOramLiveReplicationBundle result = 6;
  }
  // Hash of the consensus lease reserved by a shard-transfer coordinator.
  string transfer_lease_id_hash = 7;
}

message InstallPrivateOramLiveReplicaResponse {
  uint64 index_epoch = 1;
  string root_hash = 2;
  optional string writeback_digest = 3;
}

message RequestPrivateOramShardRecoveryRequest {
  string collection_name = 1;
  uint32 shard_id = 2;
  uint64 source_peer_id = 3;
  uint64 target_peer_id = 4;
  // Present only to restart an exact active fixed-layout transfer with fresh preinstall.
  PrivateOramActiveTransferResumeContext active_transfer_resume = 5;
}

message PrivateOramActiveTransferResumeContext {
  bool sync = 1;
  uint64 expected_layout_generation = 2;
  string expected_layout_digest = 3;
  uint64 new_layout_generation = 4;
  string new_layout_digest = 5;
  string index_state_digest = 6;
}

message RequestPrivateOramShardRecoveryResponse {
  bool accepted = 1;
}

message RequestPrivateOramReshardingResumeRequest {
  string collection_name = 1;
  uint32 shard_id = 2;
  uint32 to_shard_id = 3;
  uint64 source_peer_id = 4;
  uint64 target_peer_id = 5;
}

message RequestPrivateOramReshardingResumeResponse {
  bool accepted = 1;
}
